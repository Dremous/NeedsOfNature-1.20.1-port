name: Build NeedsOfNature (Manual)
on:
  workflow_dispatch:
    inputs:
      build_target:
        description: '构建目标：全部模块 / 仅 Animation Director / 仅 NeedsOfNature'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - animationdirector
          - needsofnature
      skip_clean:
        description: '跳过 clean（增量构建，保留上次产物，速度更快）'
        required: false
        default: false
        type: boolean
      update_fixed_release:
        description: '构建完成后更新【固定continuous‑build Release】（会覆盖旧附件！）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
jobs:
  build:
    name: Build (${{ inputs.build_target }}${{ inputs.skip_clean && ', incremental' || ', clean' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties', '**/gradle.properties', '**/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve Gradle task
        id: task
        run: |
          if [ "${{ inputs.build_target }}" = "all" ]; then
            echo "gradle_task=build" >> "$GITHUB_OUTPUT"
          else
            echo "gradle_task=:${{ inputs.build_target }}:build" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gradle build
        run: |
          if [ "${{ inputs.skip_clean }}" = "true" ]; then
            ./gradlew ${{ steps.task.outputs.gradle_task }} --no-daemon --console=plain
          else
            ./gradlew clean ${{ steps.task.outputs.gradle_task }} --no-daemon --console=plain
          fi

      - name: Verify build artifacts
        run: |
          if [ "${{ inputs.build_target }}" = "all" ] || [ "${{ inputs.build_target }}" = "animationdirector" ]; then
            ls -1 animationdirector/build/libs/*.jar || { echo "::error::animationdirector jar 未生成"; exit 1; }
          fi
          if [ "${{ inputs.build_target }}" = "all" ] || [ "${{ inputs.build_target }}" = "needsofnature" ]; then
            ls -1 needsofnature/build/libs/*.jar || { echo "::error::needsofnature jar 未生成"; exit 1; }
          fi

      - name: Upload animationdirector JAR to Actions Artifact
        if: inputs.build_target == 'all' || inputs.build_target == 'animationdirector'
        uses: actions/upload-artifact@v4
        with:
          name: animationdirector-jar
          path: animationdirector/build/libs/*.jar

      - name: Upload needsofnature JAR to Actions Artifact
        if: inputs.build_target == 'all' || inputs.build_target == 'needsofnature'
        uses: actions/upload-artifact@v4
        with:
          name: needsofnature-jar
          path: needsofnature/build/libs/*.jar

      # ========= 更新固定 Release continuous‑build =========
      - name: Update fixed continuous‑build Release
        if: inputs.update_fixed_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous-build  # 固定占位tag，仅需手动创建一次
          name: "Continuous Build 持续构建"
          prerelease: true
          overwrite: true   # 关键：覆盖该Release已有附件
          append_body: false
          # Release正文写入本次构建信息：commit短hash、构建时间、选择的构建目标
          body: |
            ## ⚠️ 自动持续构建，非正式版本
            构建提交SHA: ${{ github.sha }}
            构建目标: ${{ inputs.build_target }}
            构建时间: ${{ github.run_started_at }}
            > 此Release会被每次CI覆盖，如需历史版本请查看Workflow Artifacts
          files: |
            ${{ (inputs.build_target == 'all' || inputs.build_target == 'animationdirector') && 'animationdirector/build/libs/*.jar' || '' }}
            ${{ (inputs.build_target == 'all' || inputs.build_target == 'needsofnature') && 'needsofnature/build/libs/*.jar' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
